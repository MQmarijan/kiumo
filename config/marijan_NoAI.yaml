#该配置文件是没有AI分组的，自己调整

# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 机场订阅
proxy-providers:
  Airport1:
    url: "在这里输入订阅链接"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🟢 直连


# 节点信息
proxies:
  - {name: 🟢 直连, type: direct}

# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
# interface-name: en0
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: "/etc/nikki/run"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# 入站  
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  # namesever尽量用运营商提供的DNS
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
 
# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
# 锚点
pr: &pr {type: select, proxies: [🇹🇼 台湾, 🇭🇰 香港, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇲 美国, ♻️ 自动选择, 🌐 手动选择, 🟢 直连]}
# 策略组
proxy-groups:
  #普通策略组
  - {name: 🪟 Microsoft,!!merge <<: *pr}
  - {name: 🍀 Google,!!merge <<: *pr}
  - {name: 🍎 Apple, type: select, proxies: [🇺🇲 美国, 🇯🇵 日本, 🇭🇰 香港, 🇹🇼 台湾, 🇸🇬 新加坡, 🟢 直连]}
  - {name: 🤖 OpenAI, type: select, proxies: [🇺🇲 美国, 🇯🇵 日本, 🇸🇬 新加坡]}
  - {name: 📹 YouTube,type: select, proxies: [🍀 Google, 🇭🇰 香港, 🇹🇼 台湾, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇲 美国]}
  - {name: 🎵 Spotify, type: select, proxies: [🇺🇲 美国, 🟢 直连]}
  - {name: 🎥 Disney+,type: select, proxies: [🇯🇵 日本, 🇭🇰 香港, 🇹🇼 台湾, 🇸🇬 新加坡, 🌐 手动选择]}
  - {name: 🎥 NETFLIX,type: select, proxies: [🇯🇵 日本, 🇭🇰 香港, 🇹🇼 台湾, 🇸🇬 新加坡, 🌐 手动选择]}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连)).)*$"}
  - {name: ✈️ Speedtest,!!merge <<: *pr}
  - {name: 🎮 游戏平台,!!merge <<: *pr}
  - {name: 🎯 直连, type: select, proxies: [🟢 直连, 🌐 手动选择]}
  - {name: 🐟 漏网之鱼,!!merge <<: *pr}
  - {name: 🌏 国内媒体,!!merge <<: *pr}

  #地区分组（不包括AI机场节点）
  - {name: 🇭🇰 香港, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: 🇹🇼 台湾, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(🇹🇼|台|新北|彰化|TW|Taiwan))^((?!(港|美|日|韩|新)).)*$"}
  - {name: 🇯🇵 日本, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$" }
  - {name: 🇸🇬 新加坡, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(🇸🇬|新加坡|坡|狮城|SG|Singapore))^((?!(港|美|日|韩|台)).)*$"}
  - {name: 🇺🇲 美国, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}

  # 手动选择（包含所有策略组和所有机场的单个节点）
  - {name: 🌐 手动选择, type: select, proxies: [🇯🇵 日本, 🇸🇬 新加坡, 🇭🇰 香港, 🇹🇼 台湾, 🇺🇲 美国, ♻️ 自动选择, 🟢 直连], include-all: true}

rules:
  #01. 本地网络优先
  - RULE-SET,private_domain,🟢 直连

  #02. 中国服务直连
  - RULE-SET,cn_ip,🎯 直连
  - RULE-SET,cn_domain,🎯 直连

  #03. 自定义域名规则
  #Dia
  - DOMAIN,api.segment.io,🇺🇲 美国
  - DOMAIN-SUFFIX,launchdarkly.com,🇺🇲 美国
  - DOMAIN-SUFFIX,diabrowser.engineering,🇺🇲 美国
  #Apple Intelligence
  - DOMAIN-SUFFIX,apple-relay.apple.com,🇺🇲 美国
  - DOMAIN-SUFFIX,apple-relay.cloudflare.com,🇺🇲 美国
  - DOMAIN-KEYWORD,apple-relay,🇺🇲 美国
  #Midjourney
  - DOMAIN-SUFFIX,midjourney.com,🇹🇼 台湾

  #04. 使用分类规则
  #国内应用
  - RULE-SET,115_domain,🟢 直连
  - RULE-SET,okx_domain,🎯 直连
  - RULE-SET,wechat_domain,🟢 直连
  - RULE-SET,bilibili_domain,🌏 国内媒体
  - RULE-SET,XPTV_domain,🎯 直连
  #Apple
  - RULE-SET,apple-intelligence_domain,🇺🇲 美国
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,applecn_domain,🍎 Apple
  #Microsoft
  - RULE-SET,onedrive_domain,🪟 Microsoft
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,copilot_domain,🪟 Microsoft
  #Google
  - RULE-SET,GoogleVoice_domain,🇺🇲 美国
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,google_ip,🍀 Google,no-resolve
  #Meta
  - RULE-SET,meta_domain,🇺🇲 美国
  #Adobe
  - RULE-SET,adobePJ_domain,REJECT
  - RULE-SET,adobe_domain,🇺🇲 美国
  #国外AI
  - RULE-SET,openai_domain,🤖 OpenAI
  - RULE-SET,perplexity_domain,🇹🇼 台湾
  #国外影视
  - RULE-SET,disney+_domain,🎥 Disney+
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,netflix_ip,🎥 NETFLIX,no-resolve
  #国外合集
  - RULE-SET,github_domain,🪟 Microsoft
  - RULE-SET,tiktok_domain,🇯🇵 日本
  - RULE-SET,speedtest_domain,✈️ Speedtest
  - RULE-SET,telegram_domain,🇯🇵 日本
  - RULE-SET,telegram_ip,🇯🇵 日本,no-resolve
  - RULE-SET,paypal_domain,🇺🇲 美国
  - RULE-SET,twitter_domain,🇹🇼 台湾
  - RULE-SET,discord_domain,🇯🇵 日本
  - RULE-SET,civitai_domain,🇹🇼 台湾
  - RULE-SET,duolingo_domain,🇹🇼 台湾
  - RULE-SET,pinterest_domain,🇹🇼 台湾
  - RULE-SET,pikpak_domain,🇸🇬 新加坡
  - RULE-SET,notion_domain,🇯🇵 日本
  - RULE-SET,figma_domain,🇯🇵 日本
  - RULE-SET,spotify_domain,🎵 Spotify
  #各大游戏平台
  - RULE-SET,rockstar_domain,🎮 游戏平台
  - RULE-SET,epicgames_domain,🎮 游戏平台
  - RULE-SET,origin_domain,🎮 游戏平台
  - RULE-SET,sony_domain,🎮 游戏平台
  - RULE-SET,steam_domain,🎮 游戏平台
  - RULE-SET,nintendo_domain,🎮 游戏平台

  #05. 地理位置判断（兜底国外流量）
  - RULE-SET,geolocation-!cn,🌐 手动选择

  #06. 最终兜底
  - MATCH,🐟 漏网之鱼

  
