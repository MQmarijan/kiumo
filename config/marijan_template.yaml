# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 机场订阅
proxy-providers:
  机场名称:
    url: "在此输入你的订阅链接"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直接连接

# 节点信息
proxies:
  # - {name: DIRECT, type: direct}

# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
# interface-name: en0
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# 入站  
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  # namesever尽量用运营商提供的DNS
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
 
# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
# 锚点
pr: &pr {type: select, proxies: [台湾自动, 香港自动, 日本自动, 狮城自动, 美国自动, 自动选择, 手动选择, DIRECT]}
# 策略组
proxy-groups:
  #普通策略组
  - {name: Microsoft, type: select, proxies: [美国自动, 台湾自动, 香港自动, 日本自动, 狮城自动, 自动选择, 手动选择, DIRECT], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png}
  - {name: Google, type: select, proxies: [日本自动, 台湾自动, 香港自动, 狮城自动, 美国自动, 自动选择, 手动选择, DIRECT], icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/google(2).png}
  - {name: Apple, type: select, proxies: [美国自动, 日本自动, 香港自动, 台湾自动, 狮城自动, DIRECT], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png}
  - {name: AI枢纽, type: select, proxies: [美国自动, 日本自动, 狮城自动], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AI.png}
  - {name: YouTube, type: select, proxies: [Google, 香港自动, 台湾自动, 日本自动, 狮城自动, 美国自动], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png}
  - {name: Spotify, type: select, proxies: [台湾自动, 美国自动, DIRECT], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png}
  - {name: Disney+, type: select, proxies: [日本自动, 香港自动, 台湾自动, 狮城自动, 手动选择], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Disney.png}
  - {name: NETFLIX, type: select, proxies: [日本自动, 香港自动, 台湾自动, 狮城自动, 手动选择], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png}
  - {name: 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直接连接)).)*$", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png}
  - {name: Speedtest, !!merge <<: *pr, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png}
  - {name: 游戏平台, !!merge <<: *pr, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png}
  - {name: 直接连接, type: select, proxies: [DIRECT, 手动选择], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Direct.png}
  - {name: 漏网之鱼, !!merge <<: *pr, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png}
  - {name: 港台番剧, type: select, proxies: [直接连接, 香港自动, 台湾自动, 日本自动], icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/03CNSoft/bilibili(1).png}
  - {name: 抖快书定位, type: select, proxies: [直接连接, 香港自动, 台湾自动, 日本自动, 狮城自动, 美国自动, 手动选择], icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Null_Nation.png}

  #地区分组
  - {name: 香港自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(🇭🇰|港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png}
  - {name: 台湾自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(🇹🇼|台|TW|新北|彰化|Taiwan))^((?!(港|美|日|韩|新)).)*$", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Taiwan.png}
  - {name: 日本自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(🇯🇵|日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png}
  - {name: 狮城自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(🇸🇬|新加坡|SG|坡|狮城|Singapore))^((?!(港|美|日|韩|台)).)*$", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png}
  - {name: 美国自动, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(🇺🇸|美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$", icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png}
  
  # 手动选择（包含所有策略组和所有机场的单个节点）
  - {name: 手动选择, type: select, proxies: [日本自动, 狮城自动, 香港自动, 台湾自动, 美国自动, 自动选择, DIRECT], include-all: true, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png}

rules:
  #01. 本地网络优先
  - RULE-SET,private_domain,DIRECT

  #02. 强效匹配前置
  #港台番剧
  - DOMAIN-KEYWORD,bili,港台番剧
  - DOMAIN-SUFFIX,hdslb.com,港台番剧
  - RULE-SET,bilibili_domain,港台番剧
  #抖快书
  - RULE-SET,douyin_domain,抖快书定位
  - RULE-SET,kuaishou_domain,抖快书定位
  - RULE-SET,xiaohongshu_domain,抖快书定位

  #03. 自定义域名规则
  #Dia
  - DOMAIN,api.segment.io,美国自动
  - DOMAIN-SUFFIX,launchdarkly.com,美国自动
  - DOMAIN-SUFFIX,diabrowser.engineering,美国自动
  #Midjourney
  - DOMAIN-SUFFIX,midjourney.com,台湾自动
  #公司网站
  - DOMAIN-KEYWORD,wanheng.tech,DIRECT
  - DOMAIN-KEYWORD,wanhengtech.com,DIRECT
  - DOMAIN-KEYWORD,xinfutongtech.com,DIRECT
  #martini
  - DOMAIN-SUFFIX,martini.art,DIRECT

  #04. 分类分流规则
  #国内应用
  - RULE-SET,115_domain,DIRECT
  - RULE-SET,okx_domain,直接连接
  - RULE-SET,XPTV_domain,直接连接
  #Apple
  - RULE-SET,apple-intelligence_domain,美国自动
  - RULE-SET,applecn_domain,DIRECT
  - RULE-SET,apple_domain,Apple
  #Microsoft
  - RULE-SET,onedrive_domain,Microsoft
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,copilot_domain,Microsoft
  #Spotify
  - RULE-SET,spotify_domain,Spotify
  # 屏蔽 Spotify 广告
  - DOMAIN-SUFFIX,googlesyndication.com,REJECT
  - DOMAIN-SUFFIX,doubleclick.net,REJECT
  - DOMAIN-SUFFIX,2mdn.net,REJECT
  - DOMAIN-KEYWORD,pagead,REJECT
  - DOMAIN-KEYWORD,googleads,REJECT
  # Spotify 核心服务直连
  - DOMAIN-SUFFIX,spotify.com,Spotify
  - DOMAIN-SUFFIX,spotifycdn.com,Spotify
  - DOMAIN-SUFFIX,scdn.co,Spotify
  #Google
  - DOMAIN-KEYWORD,voice,美国自动
  - RULE-SET,GoogleVoice_domain,美国自动
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,google_ip,Google,no-resolve
  #Meta
  - RULE-SET,meta_domain,美国自动
  #Adobe
  - RULE-SET,adobe_domain,美国自动
  #国外AI
  - RULE-SET,openai_domain,AI枢纽
  - RULE-SET,anthropic_domain,AI枢纽
  - RULE-SET,perplexity_domain,AI枢纽
  #国外影视
  - RULE-SET,disney+_domain,Disney+
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,netflix_ip,NETFLIX,no-resolve
  #国外合集
  - RULE-SET,tiktok_domain,日本自动
  - RULE-SET,speedtest_domain,Speedtest
  - RULE-SET,telegram_domain,日本自动
  - RULE-SET,telegram_ip,日本自动,no-resolve
  - RULE-SET,paypal_domain,美国自动
  - RULE-SET,twitter_domain,美国自动
  - RULE-SET,ultramobile_domain,美国自动
  - RULE-SET,discord_domain,日本自动
  - RULE-SET,civitai_domain,台湾自动
  - RULE-SET,duolingo_domain,台湾自动
  - RULE-SET,pinterest_domain,台湾自动
  - RULE-SET,pikpak_domain,狮城自动
  - RULE-SET,notion_domain,日本自动
  - RULE-SET,figma_domain,日本自动
  #各大游戏平台
  - RULE-SET,rockstar_domain,游戏平台
  - RULE-SET,epicgames_domain,游戏平台
  - RULE-SET,origin_domain,游戏平台
  - RULE-SET,sony_domain,游戏平台
  - RULE-SET,steam_domain,游戏平台
  - RULE-SET,nintendo_domain,游戏平台

  #05. 中国服务补遗 (在所有特定分类之后判定)
  - RULE-SET,cn_domain,直接连接
  - RULE-SET,cn_ip,直接连接

  #06. 地理位置判断 (兜底国外流量)
  - RULE-SET,geolocation-!cn,手动选择

  #07. 最终兜底
  - MATCH,漏网之鱼

  
