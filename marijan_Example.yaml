# 机场订阅，名称不能重复
proxy-providers:
  name:
    type: http
    interval: 1800
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🟢 直连
    url: "输入订阅链接"

  AI:
    type: http
    interval: 1800
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 🇯🇵 日本
    url: "输入订阅链接"

# 用于下载订阅时指定UA
global-ua: clash.meta
    
# 全局配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
  
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 48
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
  
# 控制面板
external-controller: 0.0.0.0:9095
secret: ""
external-ui: "/etc/mihomo/run/ui"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 匹配进程 always/strict/off
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 30

# 策略组选择和fakeip缓存
profile:
  store-selected: true
  store-fake-ip: true
  
# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"
    
# 代理模式
tun:
  enable: true
  stack: mixed
  mtu: 9000
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  # 模式切换 redir-host / fake-ip
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  # 模式切换 whitelist/blacklist 
  # 黑名单模式表示如果匹配成功则不返回 Fake-IP, 白名单模式时只有匹配成功才返回 Fake-IP
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - geosite:private
    - geosite:cn
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "rule-set:private_domain,cn_domain":
    - 223.5.5.5
    - 119.29.29.29
    "rule-set:geolocation-!cn":
      - "https://dns.cloudflare.com/dns-query"
      - "https://dns.google/dns-query"
 
   
proxies:
- name: "🟢 直连"
  type: direct
  udp: true
 
# 锚点
pr: &pr {type: select, proxies: [🇸🇬 新加坡, 🇭🇰 香港, 🇯🇵 日本, 🇹🇼 台湾, 🇺🇲 美国, ♻️ 自动选择, 🌐 手动选择, 🚀 节点选择, 🟢 直连, 🤖 ai节点]}
# 策略组
proxy-groups:
  - {name: 🚀 节点选择, type: select, proxies: [🇸🇬 新加坡, 🇭🇰 香港, 🇯🇵 日本, 🇹🇼 台湾, 🇺🇲 美国, ♻️ 自动选择, 🌐 手动选择, 🟢 直连, ]}
  - {name: 🪟 Microsoft,!!merge <<: *pr}
  - {name: 🍀 Google,!!merge <<: *pr}
  - {name: 🍎 Apple, type: select, proxies: [🟢 直连, 🇺🇲 美国, 🇯🇵 日本, 🇭🇰 香港, 🇹🇼 台湾, 🇸🇬 新加坡]}
  - {name: 🤖 OpenAI, type: select, proxies: [🤖 ai节点, 🇺🇲 美国, 🇯🇵 日本, 🇸🇬 新加坡]}
  - {name: 🎥 Disney+,type: select, proxies: [🇯🇵 日本, 🇭🇰 香港, 🇹🇼 台湾, 🇸🇬 新加坡, 🌐 手动选择]}
  - {name: 🎥 NETFLIX,type: select, proxies: [🇯🇵 日本, 🇭🇰 香港, 🇹🇼 台湾, 🇸🇬 新加坡, 🌐 手动选择]}
  - {name: 📹 YouTube,type: select, proxies: [🍀 Google, 🇭🇰 香港, 🇹🇼 台湾, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇲 美国]}
  - {name: 🌐 手动选择, type: select, include-all: true}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(直连)).)*$"}
  - {name: ✈️ Speedtest,!!merge <<: *pr}
  - {name: 🎮 游戏平台,!!merge <<: *pr}
  - {name: 🎯 全球直连,!!merge <<: *pr}
  - {name: 🐟 漏网之鱼,!!merge <<: *pr}
  - {name: 🌏 国内媒体,!!merge <<: *pr}
  - {name: 🇭🇰 香港, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: 🇹🇼 台湾, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(🇹🇼|台|新北|彰化|TW|Taiwan))^((?!(港|美|日|韩|新)).)*$"}
  - {name: 🇯🇵 日本, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$" }
  - {name: 🇸🇬 新加坡, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(🇸🇬|新加坡|坡|狮城|SG|Singapore))^((?!(港|美|日|韩|台)).)*$"}
  - {name: 🇺🇲 美国, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: 🤖 ai节点, type: fallback, include-all: true, tolerance: 20, interval: 300, filter: "(?=.*(专用))^((?!(港|台|日|韩|新|美)).)*$"}

